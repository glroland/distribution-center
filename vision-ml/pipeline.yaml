          \ batch_size=batch_size, shuffle=False, collate_fn=datasets.ocr_collate)\n\
          \n    def _levenshtein(a: str, b: str) -> int:\n        if len(a) < len(b):\n\
          \            a, b = b, a\n        previous = list(range(len(b) + 1))\n \
          \       for i, ca in enumerate(a, start=1):\n            current = [i] +\
          \ [0] * len(b)\n            for j, cb in enumerate(b, start=1):\n      \
          \          cost = 0 if ca == cb else 1\n                current[j] = min(previous[j]\
          \ + 1, current[j - 1] + 1, previous[j - 1] + cost)\n            previous\
          \ = current\n        return previous[-1]\n\n    @torch.no_grad()\n    def\
