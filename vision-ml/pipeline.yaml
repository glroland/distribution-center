# PIPELINE DEFINITION
# Name: vision-ml-training
# Description: Trains the 3-stage SKU sticker extraction pipeline (localize, orient, OCR) and logs all three as nested MLflow runs under one parent run.
# Inputs:
#    catalog_qty_per_sku: int [Default: 40.0]
#    catalog_skus: list [Default: ['SKU-1001', 'SKU-1002', 'SKU-1003', 'SKU-1004', 'SKU-1005', 'SKU-1006', 'SKU-1007', 'SKU-1008', 'SKU-1009', 'SKU-1010', 'SKU-1011', 'SKU-1012', 'SKU-1013', 'SKU-1014', 'SKU-1015', 'SKU-1016', 'SKU-1017', 'SKU-1018', 'SKU-1019', 'SKU-1020']]
#    label_generator_api_url: str [Default: 'http://localhost:8005']
#    localizer_batch_size: int [Default: 32.0]
#    localizer_epochs: int [Default: 15.0]
#    localizer_lr: float [Default: 0.001]
#    mlflow_experiment_name: str [Default: 'vision-ml']
#    mlflow_tracking_auth: str [Default: 'kubernetes-namespaced']
#    mlflow_tracking_token: str [Default: '']
#    mlflow_tracking_uri: str [Default: 'https://rh-ai.apps.ocp.home.glroland.com/mlflow']
#    mlflow_workspace: str [Default: 'distribution-center']
#    ocr_angle_jitter_std: float [Default: 0.0]
#    ocr_batch_size: int [Default: 32.0]
#    ocr_epochs: int [Default: 40.0]
#    ocr_lr: float [Default: 0.001]
#    ocr_pad_frac: float [Default: 0.2]
#    ocr_rnn_hidden: int [Default: 128.0]
#    orientation_batch_size: int [Default: 32.0]
#    orientation_epochs: int [Default: 30.0]
#    orientation_lr: float [Default: 0.001]
#    orientation_pad_frac: float [Default: 0.2]
#    random_seed: int [Default: 0.0]
#    split_seed: int [Default: 0.0]
#    synthetic_num_skus: int [Default: 800.0]
#    synthetic_qty_per_sku: int [Default: 8.0]
#    test_frac: float [Default: 0.05]
#    val_frac: float [Default: 0.1]
# Outputs:
#    Output: str
components:
  comp-finalize-pipeline-run:
    executorLabel: exec-finalize-pipeline-run
    inputDefinitions:
      parameters:
        experiment_id:
          parameterType: STRING
        localizer_best_val_iou:
          parameterType: NUMBER_DOUBLE
        localizer_run_id:
          parameterType: STRING
        mlflow_tracking_auth:
          parameterType: STRING
        mlflow_tracking_token:
          parameterType: STRING
        mlflow_tracking_uri:
          parameterType: STRING
        mlflow_workspace:
          parameterType: STRING
        ocr_best_val_exact_match_accuracy:
          parameterType: NUMBER_DOUBLE
        ocr_run_id:
          parameterType: STRING
        orientation_best_val_angle_error_deg:
          parameterType: NUMBER_DOUBLE
        orientation_run_id:
          parameterType: STRING
        parent_run_id:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-generate-dataset:
    executorLabel: exec-generate-dataset
    inputDefinitions:
      parameters:
        catalog_qty_per_sku:
          parameterType: NUMBER_INTEGER
        catalog_skus:
          parameterType: LIST
        label_generator_api_url:
          parameterType: STRING
        split_seed:
          parameterType: NUMBER_INTEGER
        synthetic_num_skus:
          parameterType: NUMBER_INTEGER
        synthetic_qty_per_sku:
          parameterType: NUMBER_INTEGER
        test_frac:
          parameterType: NUMBER_DOUBLE
        val_frac:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-start-pipeline-run:
    executorLabel: exec-start-pipeline-run
    inputDefinitions:
      parameters:
        mlflow_experiment_name:
          parameterType: STRING
        mlflow_tracking_auth:
          parameterType: STRING
        mlflow_tracking_token:
          parameterType: STRING
        mlflow_tracking_uri:
          parameterType: STRING
        mlflow_workspace:
          parameterType: STRING
        run_name:
          parameterType: STRING
    outputDefinitions:
      parameters:
        experiment_id:
          parameterType: STRING
        run_id:
          parameterType: STRING
  comp-train-localizer:
    executorLabel: exec-train-localizer
    inputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        batch_size:
          parameterType: NUMBER_INTEGER
        epochs:
          parameterType: NUMBER_INTEGER
        lr:
          parameterType: NUMBER_DOUBLE
        mlflow_experiment_id:
          parameterType: STRING
        mlflow_tracking_auth:
          parameterType: STRING
        mlflow_tracking_token:
          parameterType: STRING
        mlflow_tracking_uri:
          parameterType: STRING
        mlflow_workspace:
          parameterType: STRING
        parent_run_id:
          parameterType: STRING
        random_seed:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        checkpoint:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        best_val_iou:
          parameterType: NUMBER_DOUBLE
        run_id:
          parameterType: STRING
  comp-train-ocr:
    executorLabel: exec-train-ocr
    inputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        angle_jitter_std:
          parameterType: NUMBER_DOUBLE
        batch_size:
          parameterType: NUMBER_INTEGER
        epochs:
          parameterType: NUMBER_INTEGER
        lr:
          parameterType: NUMBER_DOUBLE
        mlflow_experiment_id:
          parameterType: STRING
        mlflow_tracking_auth:
          parameterType: STRING
        mlflow_tracking_token:
          parameterType: STRING
        mlflow_tracking_uri:
          parameterType: STRING
        mlflow_workspace:
          parameterType: STRING
        pad_frac:
          parameterType: NUMBER_DOUBLE
        parent_run_id:
          parameterType: STRING
        random_seed:
          parameterType: NUMBER_INTEGER
        rnn_hidden:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        checkpoint:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        best_val_exact_match_accuracy:
          parameterType: NUMBER_DOUBLE
        run_id:
          parameterType: STRING
  comp-train-orientation:
    executorLabel: exec-train-orientation
    inputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        batch_size:
          parameterType: NUMBER_INTEGER
        epochs:
          parameterType: NUMBER_INTEGER
        lr:
          parameterType: NUMBER_DOUBLE
        mlflow_experiment_id:
          parameterType: STRING
        mlflow_tracking_auth:
          parameterType: STRING
        mlflow_tracking_token:
          parameterType: STRING
        mlflow_tracking_uri:
          parameterType: STRING
        mlflow_workspace:
          parameterType: STRING
        pad_frac:
          parameterType: NUMBER_DOUBLE
        parent_run_id:
          parameterType: STRING
        random_seed:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        checkpoint:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        best_val_angle_error_deg:
          parameterType: NUMBER_DOUBLE
        run_id:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-finalize-pipeline-run:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - finalize_pipeline_run
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef finalize_pipeline_run(\n    mlflow_tracking_uri: str,\n    mlflow_workspace:\
          \ str,\n    mlflow_tracking_token: str,\n    mlflow_tracking_auth: str,\n\
          \    experiment_id: str,\n    parent_run_id: str,\n    localizer_run_id:\
          \ str,\n    localizer_best_val_iou: float,\n    orientation_run_id: str,\n\
          \    orientation_best_val_angle_error_deg: float,\n    ocr_run_id: str,\n\
          \    ocr_best_val_exact_match_accuracy: float,\n) -> str:\n    from mlflow.tracking\
          \ import MlflowClient\n\n    from src import tracking\n\n    tracking.configure_mlflow_env(mlflow_tracking_uri,\
          \ mlflow_workspace, mlflow_tracking_token, mlflow_tracking_auth)\n    client\
          \ = MlflowClient(tracking_uri=mlflow_tracking_uri)\n\n    for key, value\
          \ in {\n        \"localizer_best_val_iou\": localizer_best_val_iou,\n  \
          \      \"orientation_best_val_angle_error_deg\": orientation_best_val_angle_error_deg,\n\
          \        \"ocr_best_val_exact_match_accuracy\": ocr_best_val_exact_match_accuracy,\n\
          \    }.items():\n        client.log_metric(parent_run_id, key, value)\n\n\
          \    for key, value in {\n        \"localizer_run_id\": localizer_run_id,\n\
          \        \"orientation_run_id\": orientation_run_id,\n        \"ocr_run_id\"\
          : ocr_run_id,\n    }.items():\n        client.set_tag(parent_run_id, key,\
          \ value)\n\n    client.set_terminated(parent_run_id, status=\"FINISHED\"\
          )\n\n    url = f\"{mlflow_tracking_uri.rstrip('/')}/#/experiments/{experiment_id}/runs/{parent_run_id}\"\
          \n    print(f\"MLflow run: {url}\")\n    return url\n\n"
        image: image-registry.openshift-image-registry.svc:5000/distribution-center/vision-ml-trainer:latest
    exec-generate-dataset:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_dataset
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_dataset(\n    label_generator_api_url: str,\n    catalog_skus:\
          \ list[str],\n    catalog_qty_per_sku: int,\n    synthetic_num_skus: int,\n\
          \    synthetic_qty_per_sku: int,\n    val_frac: float,\n    test_frac: float,\n\
          \    split_seed: int,\n    raw_data: Output[Dataset],\n) -> None:\n    import\
          \ json\n    import os\n    import random\n    from pathlib import Path\n\
          \n    os.environ[\"LABEL_GENERATOR_API_URL\"] = label_generator_api_url\n\
          \    from src import client, datasets  # noqa: E402 - needs LABEL_GENERATOR_API_URL\
          \ set first\n\n    random.seed(split_seed)\n    dest_dir = Path(raw_data.path)\n\
          \n    # notebook cell: catalog_numbers/candidate_numbers/synthetic_skus/items\n\
          \    catalog_numbers = {int(sku.split(\"-\")[1]) for sku in catalog_skus}\n\
          \    candidate_numbers = [n for n in range(1000, 10000) if n not in catalog_numbers]\n\
          \    synthetic_numbers = random.sample(candidate_numbers, synthetic_num_skus)\n\
          \    synthetic_skus = [f\"SKU-{n}\" for n in synthetic_numbers]\n\n    items\
          \ = [(sku, catalog_qty_per_sku) for sku in catalog_skus] + [\n        (sku,\
          \ synthetic_qty_per_sku) for sku in synthetic_skus\n    ]\n\n    manifest_path\
          \ = client.download_dataset(items, dest_dir=dest_dir)\n    records = datasets.load_manifest(manifest_path)\n\
          \n    train_records, val_records, test_records = datasets.split_records(\n\
          \        records, val_frac=val_frac, test_frac=test_frac, seed=split_seed,\
          \ held_out_skus=catalog_skus,\n    )\n    splits = {\n        \"train_skus\"\
          : sorted({r[\"sku\"] for r in train_records}),\n        \"val_skus\": sorted({r[\"\
          sku\"] for r in val_records}),\n        \"test_skus\": sorted({r[\"sku\"\
          ] for r in test_records}),\n        \"catalog_skus\": catalog_skus,\n  \
          \  }\n    (dest_dir / \"splits.json\").write_text(json.dumps(splits, indent=2))\n\
          \    print(f\"generated {len(records)} images -> {dest_dir}\")\n\n"
        image: image-registry.openshift-image-registry.svc:5000/distribution-center/vision-ml-trainer:latest
    exec-start-pipeline-run:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - start_pipeline_run
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef start_pipeline_run(\n    mlflow_tracking_uri: str,\n    mlflow_workspace:\
          \ str,\n    mlflow_tracking_token: str,\n    mlflow_tracking_auth: str,\n\
          \    mlflow_experiment_name: str,\n    run_name: str,\n) -> NamedTuple(\"\
          Outputs\", [(\"run_id\", str), (\"experiment_id\", str)]):  # noqa: F821\n\
          \    from collections import namedtuple\n\n    import mlflow\n\n    from\
          \ src import tracking\n\n    tracking.configure_mlflow_env(mlflow_tracking_uri,\
          \ mlflow_workspace, mlflow_tracking_token, mlflow_tracking_auth)\n    mlflow.set_tracking_uri(mlflow_tracking_uri)\n\
          \    experiment_id = mlflow.set_experiment(mlflow_experiment_name).experiment_id\n\
          \    # Left RUNNING on purpose - each stage's component is a separate process/pod\n\
          \    # and attaches to this run by id+tag rather than by staying inside\
          \ a `with`\n    # block here. finalize_pipeline_run marks it FINISHED once\
          \ all 3 are done.\n    run = mlflow.start_run(run_name=run_name, experiment_id=experiment_id)\n\
          \n    Outputs = namedtuple(\"Outputs\", [\"run_id\", \"experiment_id\"])\n\
          \    return Outputs(run.info.run_id, experiment_id)\n\n"
        image: image-registry.openshift-image-registry.svc:5000/distribution-center/vision-ml-trainer:latest
    exec-train-localizer:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_localizer
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_localizer(\n    raw_data: Input[Dataset],\n    mlflow_tracking_uri:\
          \ str,\n    mlflow_workspace: str,\n    mlflow_tracking_token: str,\n  \
          \  mlflow_tracking_auth: str,\n    mlflow_experiment_id: str,\n    parent_run_id:\
          \ str,\n    epochs: int,\n    lr: float,\n    batch_size: int,\n    random_seed:\
          \ int,\n    checkpoint: Output[Model],\n    metrics: Output[Metrics],\n\
          ) -> NamedTuple(\"Outputs\", [(\"run_id\", str), (\"best_val_iou\", float)]):\
          \  # noqa: F821\n    import json\n    import random\n    from collections\
          \ import namedtuple\n    from pathlib import Path\n\n    import mlflow\n\
          \    import torch\n    from torch import nn\n    from torch.utils.data import\
          \ DataLoader\n\n    from src import datasets, models, tracking\n\n    tracking.configure_mlflow_env(mlflow_tracking_uri,\
          \ mlflow_workspace, mlflow_tracking_token, mlflow_tracking_auth)\n    mlflow.set_tracking_uri(mlflow_tracking_uri)\n\
          \n    random.seed(random_seed)\n    torch.manual_seed(random_seed)\n   \
          \ DEVICE = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n\n    raw_dir\
          \ = Path(raw_data.path)\n    records = datasets.load_manifest(raw_dir /\
          \ \"manifest.jsonl\")\n    splits = json.loads((raw_dir / \"splits.json\"\
          ).read_text())\n\n    def _records_for(skus):\n        sku_set = set(skus)\n\
          \        return [r for r in records if r[\"sku\"] in sku_set]\n\n    train_records\
          \ = _records_for(splits[\"train_skus\"])\n    val_records = _records_for(splits[\"\
          val_skus\"])\n    print(f\"train: {len(train_records)} images   val: {len(val_records)}\
          \ images\")\n\n    train_ds = datasets.LocalizationDataset(train_records,\
          \ raw_dir)\n    val_ds = datasets.LocalizationDataset(val_records, raw_dir)\n\
          \    train_loader = DataLoader(train_ds, batch_size=batch_size, shuffle=True)\n\
          \    val_loader = DataLoader(val_ds, batch_size=batch_size, shuffle=False)\n\
          \n    def batch_iou(pred: torch.Tensor, target: torch.Tensor) -> float:\n\
          \        px0, py0, px1, py1 = pred.unbind(-1)\n        tx0, ty0, tx1, ty1\
          \ = target.unbind(-1)\n        ix0, iy0 = torch.maximum(px0, tx0), torch.maximum(py0,\
          \ ty0)\n        ix1, iy1 = torch.minimum(px1, tx1), torch.minimum(py1, ty1)\n\
          \        intersection = (ix1 - ix0).clamp(min=0) * (iy1 - iy0).clamp(min=0)\n\
          \        pred_area = (px1 - px0).clamp(min=0) * (py1 - py0).clamp(min=0)\n\
          \        target_area = (tx1 - tx0).clamp(min=0) * (ty1 - ty0).clamp(min=0)\n\
          \        union = (pred_area + target_area - intersection).clamp(min=1e-6)\n\
          \        return (intersection / union).mean().item()\n\n    model = models.LocalizerNet().to(DEVICE)\n\
          \    optimizer = torch.optim.Adam(model.parameters(), lr=lr)\n    loss_fn\
          \ = nn.SmoothL1Loss()\n\n    run = mlflow.start_run(\n        experiment_id=mlflow_experiment_id,\n\
          \        run_name=\"localizer\",\n        tags={\"mlflow.parentRunId\":\
          \ parent_run_id},\n    )\n\n    best_val_iou = -1.0\n    best_state_dict\
          \ = None\n    with run:\n        mlflow.log_params(\n            {\"stage\"\
          : \"localizer\", \"epochs\": epochs, \"batch_size\": batch_size, \"lr\"\
          : lr,\n             \"model\": \"LocalizerNet\", \"random_seed\": random_seed}\n\
          \        )\n\n        for epoch in range(epochs):\n            model.train()\n\
          \            train_loss_total = 0.0\n            for images, targets in\
          \ train_loader:\n                images, targets = images.to(DEVICE), targets.to(DEVICE)\n\
          \                optimizer.zero_grad()\n                preds = model(images)\n\
          \                loss = loss_fn(preds, targets)\n                loss.backward()\n\
          \                optimizer.step()\n                train_loss_total += loss.item()\
          \ * images.size(0)\n            train_loss = train_loss_total / len(train_ds)\n\
          \n            model.eval()\n            val_loss_total = 0.0\n         \
          \   val_iou_total = 0.0\n            with torch.no_grad():\n           \
          \     for images, targets in val_loader:\n                    images, targets\
          \ = images.to(DEVICE), targets.to(DEVICE)\n                    preds = model(images)\n\
          \                    val_loss_total += loss_fn(preds, targets).item() *\
          \ images.size(0)\n                    val_iou_total += batch_iou(preds,\
          \ targets) * images.size(0)\n            val_loss = val_loss_total / len(val_ds)\n\
          \            val_iou = val_iou_total / len(val_ds)\n\n            is_best\
          \ = val_iou > best_val_iou\n            if is_best:\n                best_val_iou\
          \ = val_iou\n                best_state_dict = {k: v.detach().cpu().clone()\
          \ for k, v in model.state_dict().items()}\n            print(f\"epoch {epoch\
          \ + 1:2d}/{epochs}  train_loss={train_loss:.4f}  val_loss={val_loss:.4f}\
          \  \"\n                  f\"val_iou={val_iou:.3f}{'  (best)' if is_best\
          \ else ''}\")\n\n            mlflow.log_metrics({\"train_loss\": train_loss,\
          \ \"val_loss\": val_loss, \"val_iou\": val_iou}, step=epoch)\n\n       \
          \ model.load_state_dict(best_state_dict)\n        torch.save(model.state_dict(),\
          \ checkpoint.path)\n        mlflow.log_metric(\"best_val_iou\", best_val_iou)\n\
          \        mlflow.log_artifact(checkpoint.path, artifact_path=\"checkpoints\"\
          )\n        run_id = mlflow.active_run().info.run_id\n\n    metrics.log_metric(\"\
          best_val_iou\", best_val_iou)\n    print(f\"saved checkpoint (best val_iou={best_val_iou:.3f})\"\
          )\n\n    Outputs = namedtuple(\"Outputs\", [\"run_id\", \"best_val_iou\"\
          ])\n    return Outputs(run_id, best_val_iou)\n\n"
