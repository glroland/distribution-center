          \ int,\n    checkpoint: Output[Model],\n    metrics: Output[Metrics],\n\
          ) -> NamedTuple(\"Outputs\", [(\"run_id\", str), (\"best_val_exact_match_accuracy\"\
          , float)]):  # noqa: F821\n    import json\n    import random\n    from\
          \ collections import namedtuple\n    from pathlib import Path\n\n    import\
          \ mlflow\n    import torch\n    from torch.utils.data import DataLoader\n\
          \n    from src import datasets, models, tracking\n\n    tracking.configure_mlflow_env(mlflow_tracking_uri,\
