          : pad_frac,\n             \"angle_jitter_std\": angle_jitter_std, \"rnn_hidden\"\
          : rnn_hidden, \"model\": \"CRNNReader\",\n             \"random_seed\":\
          \ random_seed}\n        )\n\n        for epoch in range(epochs):\n     \
