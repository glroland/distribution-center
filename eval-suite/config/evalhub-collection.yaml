# Collection spec rendered into a ConfigMap by
# scripts/render_evalhub_configmap.py and applied via `make
# register-eval-suite` -- see evalhub-provider.yaml's header comment for why
# this ConfigMap mechanism, not `evalhub collections create --file`, is what
# the OpenShift AI dashboard and `evalhub eval run` actually use. Shape
# matches evalhub.models.api.CollectionCreateRequest (plus an `id`, added by
# the render script) -- each benchmarks[].id is a benchmark id from
# evalhub-provider.yaml.
#
# benchmarks[].provider_id below is the literal `dc-eval-suite` id, not a
# placeholder: unlike `evalhub providers create` (which always assigns its
# own random UUID, ignoring any id you send), the ConfigMap mechanism uses
# exactly the id the render script sets on evalhub-provider.yaml's spec, so
# it's already known and stable up front.

name: "Distribution Center End-to-End Evaluation v1"
description: >
  Prompt accuracy + MCP trajectory correctness + end-to-end outcome
  accuracy for the distribution-center demo agent. Intended to run
  nightly and on any PR touching order_extraction.py, fulfillment.py,
  any service's mcp_server.py, or any service's own prompts.json.
category: agent-evaluation
tags: [distribution-center, a2a, mcp, byof, demo, v1]
benchmarks:
  - id: dc-extraction-accuracy
    provider_id: dc-eval-suite
    weight: 1.0
    pass_criteria:
      threshold: 0.90

  - id: dc-mcp-trajectory
    provider_id: dc-eval-suite
    weight: 1.0
    pass_criteria:
      threshold: 0.90

  - id: dc-end-to-end
    provider_id: dc-eval-suite
    weight: 1.5   # heaviest weight: the business-level outcome is what customers see
    pass_criteria:
      threshold: 0.80

# An additional gate on the weighted aggregate, on top of each benchmark's
# own threshold above -- both must pass.
pass_criteria:
  threshold: 0.85
