# EvalHub configuration for the distribution-center demo.
# ============================================================================
# Single source of truth for registering eval-suite's three BYOF benchmarks
# with a running EvalHub instance and combining them into one weighted,
# gated collection. Modeled on eval-hub-sdk's own reference BYOF example
# (github.com/williamcaban/edd-demo/evalhub.yaml).
#
# This file does NOT stand up EvalHub itself -- the server
# (`trustyai.opendatahub.io/v1alpha1 EvalHub`, owned by the TrustyAI
# operator) is cluster infrastructure someone else deploys once per OpenShift
# AI namespace. There is also no per-job Kubernetes resource to hand-author:
# registering a provider/collection and submitting a run are REST/CLI calls
# against that already-running server, not `oc apply`.
#
# Before registering, `provider.runtime.k8s.image` below must point at a
# real, already-pushed build -- see deploy/Jenkinsfile's "Create Docker Image
# for eval-suite" stage, which pushes
# registry.home.glroland.com/distribution-center/eval-suite:$BUILD_NUMBER
# (replace this file's REPLACE_WITH_BUILD_NUMBER placeholder with that
# number; no ":latest" is pushed for this image).
#
# Typical usage against a deployed EvalHub, once the image tag above is set:
#   evalhub providers create  --file config/evalhub.yaml   # registers `provider`
#   evalhub collections create --file config/evalhub.yaml  # registers `collection`
#   evalhub eval run --collection distribution-center-eval-v1 \
#     --model-url $AGENT_URL --wait
# or, from the repo root, `make register-eval-suite` for the first two
# commands (see the root Makefile).
#
# Without EvalHub installed, run the same three benchmarks directly:
#   cd eval-suite && python -m src --adapter all
# (see README.md)

# ── Provider registration ───────────────────────────────────────────────────
provider:
  id: dc-eval-suite
  name: "Distribution Center Eval Suite"
  description: >
    Custom BYOF evaluator for the distribution-center demo: prompt-extraction
    accuracy, MCP tool-call structure/function/performance, and end-to-end
    agent outcome correctness. Wraps eval-suite/src/adapters/*.py.
  tags: [distribution-center, a2a, mcp, byof, demo]
  runtime:
    local:
      command: "cd eval-suite && EVALHUB_JOB_SPEC_PATH=$EVALHUB_JOB_SPEC_PATH python -m src.evalhub_entrypoint"
    k8s:
      # Pushed by deploy/Jenkinsfile's "Create Docker Image for eval-suite" /
      # "Reload then push images to quay" stages, tagged with the Jenkins
      # build number (e.g. registry.home.glroland.com/distribution-center/
      # eval-suite:42) -- no ":latest" is pushed for this image, so replace
      # the placeholder tag below with the build you want this collection
      # to evaluate before registering it.
      image: registry.home.glroland.com/distribution-center/eval-suite:REPLACE_WITH_BUILD_NUMBER
      entrypoint: ["python", "-m", "src.evalhub_entrypoint"]
      cpu_request: 250m
      memory_request: 512Mi
      cpu_limit: "1"
      memory_limit: 1Gi
  benchmarks:
    - id: dc-extraction-accuracy
      name: "PO Extraction Field Accuracy"
      description: >
        Field-level accuracy of local-dc-agent's order_extraction.py against
        golden PO PDFs with known-correct fields, using the exact prompt
        (MLflow Prompt Registry or local catalog, per PROMPT_SOURCE) and tool
        schema production would use. Gates promoting a new
        dc-agent.order_extraction.system_prompt version.
      category: capability
      metrics: [mean_field_accuracy]
      primary_score:
        metric: mean_field_accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.90

    - id: dc-mcp-trajectory
      name: "Fulfillment MCP Tool-Call Trajectory"
      description: >
        Runs real POs through local-dc-agent and validates the captured MCP
        tool-call stream (via progress_webhook) against the five downstream
        servers' live tool schemas, plus checks that every stock decrement
        was preceded by a robot__get_item_photo -> label__infer_sku
        visual-verification pair per the fulfillment policy prompt.
      category: reliability
      metrics: [schema_conformance, mean_inter_call_latency_seconds, total_tool_calls]
      primary_score:
        metric: schema_conformance
        lower_is_better: false
      pass_criteria:
        threshold: 0.90

    - id: dc-end-to-end
      name: "End-to-End Fulfillment Outcome Accuracy"
      description: >
        Submits POs with a stock-availability outcome known in advance
        (computed from local-wms-api/data/inventory.csv and
        local-inventory-robot-api/data/shelves.csv) and checks the agent's
        final fulfilled_qty per line item and overall order_status against
        that ground truth. Rules-based, not an LLM judge -- correctness here
        is a computable fact.
      category: capability
      metrics: [mean_scenario_score, num_scenarios]
      primary_score:
        metric: mean_scenario_score
        lower_is_better: false
      pass_criteria:
        threshold: 0.80

# ── Collection definition ───────────────────────────────────────────────────
# All three benchmarks combined into one reusable, weighted, gated suite.
collection:
  id: distribution-center-eval-v1
  name: "Distribution Center End-to-End Evaluation v1"
  description: >
    Prompt accuracy + MCP trajectory correctness + end-to-end outcome
    accuracy for the distribution-center demo agent. Intended to run
    nightly and on any PR touching order_extraction.py, fulfillment.py,
    any service's mcp_server.py, or any service's own prompts.json.
  tags: [distribution-center, a2a, mcp, byof, demo, v1]
  benchmarks:
    - provider_id: dc-eval-suite
      benchmark_id: dc-extraction-accuracy
      weight: 1.0
      pass_criteria:
        threshold: 0.90

    - provider_id: dc-eval-suite
      benchmark_id: dc-mcp-trajectory
      weight: 1.0
      pass_criteria:
        threshold: 0.90

    - provider_id: dc-eval-suite
      benchmark_id: dc-end-to-end
      weight: 1.5   # heaviest weight: the business-level outcome is what customers see
      pass_criteria:
        threshold: 0.80

  # An additional gate on the weighted aggregate, on top of each benchmark's
  # own threshold above -- both must pass.
  pass_criteria:
    threshold: 0.85

# ── Evaluation job ───────────────────────────────────────────────────────────
job:
  name: "distribution-center-eval"
  tags: [demo, distribution-center]
  model:
    url: "${AGENT_URL:-http://localhost:9100/}"
    name: "${OPENAI_MODEL:-dc-agent}"
  collection_id: distribution-center-eval-v1
  experiment:
    name: "distribution-center-eval"   # same MLflow instance dc-agent already logs prompts/traces to
