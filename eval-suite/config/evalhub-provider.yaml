# Provider spec, rendered into a ConfigMap by
# scripts/render_evalhub_configmap.py and applied via `make
# register-eval-suite` (`oc apply`, in redhat-ods-applications).
#
# This is NOT what `evalhub providers create --file ...` (a plain REST
# create, not an upsert) consumes -- that call always assigns its own
# random UUID as the provider's real id regardless of `name` below, writes
# straight to EvalHub's runtime DB, and never reconciles into the EvalHub
# CR's status or the OpenShift AI dashboard's Evaluation Stack UI. What
# actually drives the dashboard and `evalhub eval run`/`make evalhub-run`
# is the EvalHub CR's spec.providers (trustyai.opendatahub.io/v1alpha1
# EvalHub, see home-utils' oai/day_two/cluster_config/evalhub/evalhub.yaml),
# which the operator reconciles against a ConfigMap in the same namespace
# labeled trustyai.opendatahub.io/evalhub-provider-name=dc-eval-suite --
# confirmed the hard way: registering via REST first left the dashboard
# showing nothing, and a first attempt at the CR/ConfigMap path with
# evalhub-provider-type: custom failed reconciliation indefinitely
# ("Failed to reconcile Provider ConfigMaps: provider \"dc-eval-suite\" not
# found") until switched to type: system -- that label's only supported
# value, not a claim of being one of the operator's built-in providers.
#
# The k8s runtime image below must point at a real, already-pushed build --
# see deploy/Jenkinsfile's "Create Docker Image for eval-suite" stage,
# which pushes registry.home.glroland.com/distribution-center/eval-suite:
# $BUILD_NUMBER (no ":latest" is pushed for this image). Bump the tag here
# and re-run `make register-eval-suite` to point the live provider at a new
# build -- `oc apply` on the rendered ConfigMap is a real upsert, so this
# is safe to re-run on every build, unlike the old REST-create approach.

name: dc-eval-suite
title: "Distribution Center Eval Suite"
description: >
  Custom BYOF evaluator for the distribution-center demo: prompt-extraction
  accuracy, MCP tool-call structure/function/performance, and end-to-end
  agent outcome correctness. Wraps eval-suite/src/adapters/*.py.
tags: [distribution-center, a2a, mcp, byof, demo]
runtime:
  local:
    command: "cd eval-suite && EVALHUB_JOB_SPEC_PATH=$EVALHUB_JOB_SPEC_PATH python -m src.evalhub_entrypoint"
  k8s:
    image: registry.home.glroland.com/distribution-center/eval-suite:28
    entrypoint: ["python", "-m", "src.evalhub_entrypoint"]
    cpu_request: 250m
    memory_request: 512Mi
    cpu_limit: "1"
    memory_limit: 1Gi
benchmarks:
  - id: dc-extraction-accuracy
    name: "PO Extraction Field Accuracy"
    description: >
      Field-level accuracy of local-dc-agent's order_extraction.py against
      golden PO PDFs with known-correct fields, using the exact prompt
      (MLflow Prompt Registry or local catalog, per PROMPT_SOURCE) and tool
      schema production would use. Gates promoting a new
      dc-agent.order_extraction.system_prompt version.
    category: capability
    metrics: [mean_field_accuracy]
    primary_score:
      metric: mean_field_accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.90

  - id: dc-mcp-trajectory
    name: "Fulfillment MCP Tool-Call Trajectory"
    description: >
      Runs real POs through local-dc-agent and validates the captured MCP
      tool-call stream (via progress_webhook) against the five downstream
      servers' live tool schemas, plus checks that every stock decrement
      was preceded by a robot__get_item_photo -> label__infer_sku
      visual-verification pair per the fulfillment policy prompt.
    category: reliability
    metrics: [schema_conformance, mean_inter_call_latency_seconds, total_tool_calls]
    primary_score:
      metric: schema_conformance
      lower_is_better: false
    pass_criteria:
      threshold: 0.90

  - id: dc-end-to-end
    name: "End-to-End Fulfillment Outcome Accuracy"
    description: >
      Submits POs with a stock-availability outcome known in advance
      (computed from local-wms-api/data/inventory.csv and
      local-inventory-robot-api/data/shelves.csv) and checks the agent's
      final fulfilled_qty per line item and overall order_status against
      that ground truth. Rules-based, not an LLM judge -- correctness here
      is a computable fact.
    category: capability
    metrics: [mean_scenario_score, num_scenarios]
    primary_score:
      metric: mean_scenario_score
      lower_is_better: false
    pass_criteria:
      threshold: 0.80
