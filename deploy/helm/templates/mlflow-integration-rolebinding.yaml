{{- if and .Values.global.mlflow.enabled .Values.global.mlflow.serviceAccounts }}
{{- $root := . }}
{{- range .Values.global.mlflow.serviceAccounts }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "adc.fullname" $root }}-mlflow-{{ . }}
  labels:
    {{- include "adc.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/component: mlflow-tracing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $root.Values.global.mlflow.integrationClusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
