{{- if not .Values.openai.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adc.openai.secretName" . }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: openai-credentials
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.openai.apiKey | quote }}
{{- end }}
