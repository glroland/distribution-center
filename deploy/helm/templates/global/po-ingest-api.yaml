{{- if .Values.poIngestApi.enabled }}
{{- $name := printf "%s-po-ingest-api" (include "adc.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: po-ingest-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: po-ingest-api
spec:
  replicas: {{ .Values.poIngestApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: po-ingest-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: po-ingest-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: po-ingest-api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "adc.podSecurityContext" . | nindent 8 }}
      containers:
        - name: po-ingest-api
          image: {{ include "adc.image" (dict "root" $ "image" .Values.poIngestApi.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "adc.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.poIngestApi.port }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.poIngestApi.port | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.poIngestApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: po-ingest-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: po-ingest-api
spec:
  selector:
    app.kubernetes.io/name: po-ingest-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.poIngestApi.port }}
      targetPort: http
{{- if and .Values.openshift.routes.enabled .Values.poIngestApi.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: po-ingest-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: po-ingest-api
spec:
  to:
    kind: Service
    name: {{ $name }}
  port:
    targetPort: http
  tls:
    termination: {{ .Values.openshift.routes.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.openshift.routes.tls.insecureEdgeTerminationPolicy }}
{{- end }}
{{- end }}
