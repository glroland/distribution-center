# Default values for the supervisorApi subchart. The umbrella chart's
# values.yaml overrides these under the `supervisorApi:` key; the port itself
# lives under `global.supervisorApi.port` since dc-agent (in the
# distributionCenter subchart) needs it too.

enabled: true
image:
  repository: supervisor-api
  tag: latest
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
route:
  enabled: false
