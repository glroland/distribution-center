{{- if and .Values.enabled .Values.global.openshift.routes.enabled .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "adc.labelApi.serviceName" . }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: label-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: label-api
spec:
  to:
    kind: Service
    name: {{ include "adc.labelApi.serviceName" . }}
  port:
    targetPort: http
  tls:
    termination: {{ .Values.global.openshift.routes.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.global.openshift.routes.tls.insecureEdgeTerminationPolicy }}
{{- end }}
