# Default values for the robotApi subchart -- a standalone example so this
# chart is functional on its own. The umbrella chart's values.yaml
# overrides these under the `robotApi:` key; the port itself lives under
# `global.robotApi.port` since dc-agent (a sibling subchart) needs it too.

enabled: true
displayName: "Distribution Center A"
image:
  repository: local-inventory-robot-api
grid:
  width: 10
  height: 10
dock:
  x: 0
  "y": 0
carryCapacity: 100
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
# Seeds the ConfigMap mounted at data/shelves.csv.
shelvesCsv: |
  sku,qty,location_x,location_y
  SKU-1001,50,3,5
  SKU-1001,10,6,6
  SKU-1002,20,7,2
  SKU-1003,15,1,8
  SKU-1004,40,9,4
  SKU-1005,5,5,6
  SKU-1006,60,2,9
