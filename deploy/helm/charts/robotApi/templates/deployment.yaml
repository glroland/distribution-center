{{- if .Values.enabled }}
{{- $svcName := include "adc.robotApi.serviceName" . }}
{{- $cmName := printf "%s-robot-shelves" (include "adc.fullname" $) }}
{{- $labelApiSvc := include "adc.labelApi.serviceName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: robot-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: robot-api
  annotations:
    distribution-center/display-name: {{ .Values.displayName | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: robot-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robot-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: robot-api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "adc.podSecurityContext" . | nindent 8 }}
      containers:
        - name: robot-api
          image: {{ include "adc.image" (dict "root" $ "image" .Values.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "adc.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.global.robotApi.port }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.global.robotApi.port | quote }}
            - name: SHELVES_CSV_PATH
              value: data/shelves.csv
            - name: GRID_WIDTH
              value: {{ .Values.grid.width | quote }}
            - name: GRID_HEIGHT
              value: {{ .Values.grid.height | quote }}
            - name: DOCK_X
              value: {{ .Values.dock.x | quote }}
            - name: DOCK_Y
              value: {{ .Values.dock.y | quote }}
            - name: CARRY_CAPACITY
              value: {{ .Values.carryCapacity | quote }}
            - name: LABEL_API_URL
              value: http://{{ $labelApiSvc }}:{{ .Values.global.labelApi.port }}
            {{- include "adc.mlflow.envVars" . | nindent 12 }}
          volumeMounts:
            - name: shelves-data
              mountPath: /app/data/shelves.csv
              subPath: shelves.csv
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: shelves-data
          configMap:
            name: {{ $cmName }}
{{- end }}
