{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "adc.poIngestApi.serviceName" . }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: po-ingest-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: po-ingest-api
spec:
  selector:
    app.kubernetes.io/name: po-ingest-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.global.poIngestApi.port }}
      targetPort: http
{{- end }}
