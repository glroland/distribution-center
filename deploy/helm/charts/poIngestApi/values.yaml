# Default values for the poIngestApi subchart. The umbrella chart's
# values.yaml overrides these under the `poIngestApi:` key; the port itself
# lives under `global.poIngestApi.port` since dc-agent (in the
# distributionCenter subchart) needs it too.

enabled: true
image:
  repository: po-ingest-api
  tag: latest
replicaCount: 1
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
route:
  enabled: true
