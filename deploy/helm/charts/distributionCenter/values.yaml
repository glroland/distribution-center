# Default values for the distributionCenter subchart -- a standalone
# example so this chart is functional on its own. The umbrella chart's
# values.yaml overrides these under the `distributionCenter:` key with the
# real, user-maintained config.

name: distribution-center-a
displayName: "Distribution Center A"
locationName: DC-VIRTUAL-01

dcAgent:
  image:
    repository: local-dc-agent
  port: 9100
  maxFulfillmentTurns: 1000
  mcpToolCallTimeoutSeconds: 60
  openaiRequestTimeoutSeconds: 60
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  route:
    enabled: true

wmsApi:
  image:
    repository: local-wms-api
  port: 8001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  inventoryCsv: |
    sku,on_hand_qty,location_x,location_y
    SKU-1001,120,3,5
    SKU-1002,45,7,2
    SKU-1003,300,1,1
    SKU-1004,0,9,4
    SKU-1005,78,5,8

robotApi:
  image:
    repository: local-inventory-robot-api
  port: 8002
  grid:
    width: 10
    height: 10
  dock:
    x: 0
    "y": 0
  carryCapacity: 100
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  shelvesCsv: |
    sku,qty,location_x,location_y
    SKU-1001,50,3,5
    SKU-1001,10,6,6
    SKU-1002,20,7,2
    SKU-1003,15,1,8
    SKU-1004,40,9,4
    SKU-1005,5,5,6
    SKU-1006,60,2,9

shippingApi:
  image:
    repository: local-shipping-api
  port: 8004
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
