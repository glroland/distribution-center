{{- range $dc := .Values.centers }}
{{- $root := $ }}
{{- $svcName := include "adc.dc.serviceName" (dict "root" $root "dc" $dc "component" "wms-api") }}
{{- $cmName := printf "%s-%s-wms-inventory" (include "adc.fullname" $root) $dc.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "adc.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/name: wms-api
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: wms-api
    distribution-center: {{ $dc.name }}
  annotations:
    distribution-center/display-name: {{ $dc.displayName | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wms-api
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      distribution-center: {{ $dc.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wms-api
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: wms-api
        distribution-center: {{ $dc.name }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "adc.podSecurityContext" $root | nindent 8 }}
      containers:
        - name: wms-api
          image: {{ include "adc.image" (dict "root" $root "image" $dc.wmsApi.image) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            {{- include "adc.containerSecurityContext" $root | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $dc.wmsApi.port }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ $dc.wmsApi.port | quote }}
            - name: LOCATION_NAME
              value: {{ $dc.locationName | quote }}
            - name: INVENTORY_CSV_PATH
              value: data/inventory.csv
            {{- include "adc.mlflow.envVars" $root | nindent 12 }}
          volumeMounts:
            - name: inventory-data
              mountPath: /app/data/inventory.csv
              subPath: inventory.csv
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $dc.wmsApi.resources | nindent 12 }}
      volumes:
        - name: inventory-data
          configMap:
            name: {{ $cmName }}
{{- end }}
