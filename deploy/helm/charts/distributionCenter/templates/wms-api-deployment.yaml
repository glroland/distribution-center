{{- $svcName := include "adc.distributionCenter.serviceName" (dict "root" $ "component" "wms-api") }}
{{- $cmName := printf "%s-wms-inventory" (include "adc.fullname" $) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: wms-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: wms-api
  annotations:
    distribution-center/display-name: {{ .Values.displayName | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wms-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wms-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: wms-api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "adc.podSecurityContext" . | nindent 8 }}
      containers:
        - name: wms-api
          image: {{ include "adc.image" (dict "root" $ "image" .Values.wmsApi.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "adc.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.wmsApi.port }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.wmsApi.port | quote }}
            - name: LOCATION_NAME
              value: {{ .Values.locationName | quote }}
            - name: INVENTORY_CSV_PATH
              value: data/inventory.csv
            {{- include "adc.mlflow.envVars" . | nindent 12 }}
          volumeMounts:
            - name: inventory-data
              mountPath: /app/data/inventory.csv
              subPath: inventory.csv
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.wmsApi.resources | nindent 12 }}
      volumes:
        - name: inventory-data
          configMap:
            name: {{ $cmName }}
