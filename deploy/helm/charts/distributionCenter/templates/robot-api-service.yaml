{{- $svcName := include "adc.distributionCenter.serviceName" (dict "root" $ "component" "robot-api") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: robot-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: robot-api
spec:
  selector:
    app.kubernetes.io/name: robot-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.robotApi.port }}
      targetPort: http
