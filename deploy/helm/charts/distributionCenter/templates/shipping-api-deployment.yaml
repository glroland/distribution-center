{{- range $dc := .Values.centers }}
{{- $root := $ }}
{{- $svcName := include "adc.dc.serviceName" (dict "root" $root "dc" $dc "component" "shipping-api") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "adc.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/name: shipping-api
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: shipping-api
    distribution-center: {{ $dc.name }}
  annotations:
    distribution-center/display-name: {{ $dc.displayName | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-api
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      distribution-center: {{ $dc.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-api
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: shipping-api
        distribution-center: {{ $dc.name }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "adc.podSecurityContext" $root | nindent 8 }}
      containers:
        - name: shipping-api
          image: {{ include "adc.image" (dict "root" $root "image" $dc.shippingApi.image) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            {{- include "adc.containerSecurityContext" $root | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $dc.shippingApi.port }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ $dc.shippingApi.port | quote }}
            {{- include "adc.mlflow.envVars" $root | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $dc.shippingApi.resources | nindent 12 }}
{{- end }}
