# Default values for the dashboardUi subchart. The umbrella chart's
# values.yaml overrides these under the `dashboardUi:` key.

enabled: true
image:
  repository: dashboard-ui
port: 8090
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
route:
  enabled: true

# The distribution center this dashboard sends purchase orders to.
# Hand-mirrors the umbrella chart's dcAgent/wmsApi/robotApi/shippingApi
# blocks (same reason `dashboard-ui/src/settings.py`'s DISTRIBUTION_CENTER
# is hand-mirrored for local dev -- Helm only shares `global` values across
# subcharts, never one subchart's values with another) -- keep the `name`
# and ports in sync with those blocks so the in-cluster Service DNS names
# line up.
distributionCenter:
  name: distribution-center-a
  displayName: "Distribution Center A"
  dcAgentPort: 9100
  wmsApiPort: 8001
  robotApiPort: 8002
  shippingApiPort: 8004
  grid:
    width: 10
    height: 10
  dock:
    x: 0
    "y": 0
