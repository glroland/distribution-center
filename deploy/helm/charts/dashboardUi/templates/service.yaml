{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "adc.dashboardUi.serviceName" . }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: dashboard-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard-ui
spec:
  selector:
    app.kubernetes.io/name: dashboard-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
{{- end }}
