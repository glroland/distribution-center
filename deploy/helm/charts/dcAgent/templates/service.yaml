{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "adc.dcAgent.serviceName" . }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: dc-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dc-agent
spec:
  selector:
    app.kubernetes.io/name: dc-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
{{- end }}
