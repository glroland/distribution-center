{{- if .Values.enabled }}
{{- $svcName := include "adc.dcAgent.serviceName" . }}
{{- $wmsSvc := include "adc.wmsApi.serviceName" . }}
{{- $robotSvc := include "adc.robotApi.serviceName" . }}
{{- $shippingSvc := include "adc.shippingApi.serviceName" . }}
{{- $poIngestSvc := include "adc.poIngestApi.serviceName" . }}
{{- $supervisorSvc := include "adc.supervisorApi.serviceName" . }}
{{- $labelApiSvc := include "adc.labelApi.serviceName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "adc.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: dc-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dc-agent
  annotations:
    distribution-center/display-name: {{ .Values.displayName | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dc-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dc-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dc-agent
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "adc.podSecurityContext" . | nindent 8 }}
      containers:
        - name: dc-agent
          image: {{ include "adc.image" (dict "root" $ "image" .Values.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "adc.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.port | quote }}
            # Wired to the sibling local-* components, each its own subchart.
            - name: WMS_API_URL
              value: http://{{ $wmsSvc }}:{{ .Values.global.wmsApi.port }}
            - name: ROBOT_API_URL
              value: http://{{ $robotSvc }}:{{ .Values.global.robotApi.port }}
            - name: SHIPPING_API_URL
              value: http://{{ $shippingSvc }}:{{ .Values.global.shippingApi.port }}
            # Wired to the cluster-wide global services.
            - name: PO_INGEST_API_URL
              value: http://{{ $poIngestSvc }}:{{ .Values.global.poIngestApi.port }}
            - name: SUPERVISOR_API_URL
              value: http://{{ $supervisorSvc }}:{{ .Values.global.supervisorApi.port }}
            - name: LABEL_API_URL
              value: http://{{ $labelApiSvc }}:{{ .Values.global.labelApi.port }}
            - name: AGENT_URL
              value: http://{{ $svcName }}:{{ .Values.port }}/
            - name: MAX_FULFILLMENT_TURNS
              value: {{ .Values.maxFulfillmentTurns | quote }}
            - name: MCP_TOOL_CALL_TIMEOUT_SECONDS
              value: {{ .Values.mcpToolCallTimeoutSeconds | quote }}
            - name: OPENAI_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.openaiRequestTimeoutSeconds | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.global.openai.model | quote }}
            {{- if .Values.global.openai.baseUrl }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.global.openai.baseUrl | quote }}
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "adc.openai.secretName" . }}
                  key: {{ .Values.global.openai.existingSecretKey }}
            {{- include "adc.mlflow.envVars" . | nindent 12 }}
          readinessProbe:
            # /ready reflects whether the worker has finished connecting to
            # every downstream MCP server (wms/robot/shipping/supervisor/
            # label). It's expected to fail for a while after a fresh deploy
            # or cluster restart if this pod comes up before those do --
            # McpToolRouter retries those connections with backoff in the
            # background instead of crashing, so traffic just isn't routed
            # here until it's actually able to process orders.
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            # Deliberately independent of MCP connectivity (unlike
            # readinessProbe) -- this must only catch a genuinely wedged
            # process, not a slow/unavailable downstream dependency that's
            # still being retried, or Kubernetes would kill and restart a pod
            # that's correctly waiting rather than broken.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
