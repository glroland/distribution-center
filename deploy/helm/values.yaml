# Default values for the ai-distribution-center chart.
#
# Everything below `global` is scoped to one of the subcharts under charts/
# (poIngestApi, supervisorApi, distributionCenter) and simply overrides that
# subchart's own defaults in charts/<name>/values.yaml. Values under `global`
# are the only ones Helm shares across all subcharts automatically.

global:
  # Prefix applied to every image repository below, e.g. an OpenShift
  # internal registry: image-registry.openshift-image-registry.svc:5000/my-project
  imageRegistry: "registry.home.glroland.com/distribution-center"
  imageTag: 16
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Left empty so OpenShift's restricted-v2 SCC assigns a UID/fsGroup from
  # the project's allocated range. Set only if your cluster requires it.
  podSecurityContext: {}

  openshift:
    # Creates route.openshift.io/v1 Route objects for components with
    # route.enabled: true below. Disable if deploying to plain Kubernetes.
    routes:
      enabled: true
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  openai:
    # Consumed by every distribution center's dc-agent (OPENAI_API_KEY).
    # Leave apiKey empty and set existingSecret to use a pre-created secret
    # instead of storing the key in values.
    apiKey: ""
    model: gemma-4
    # Set to point dc-agent at an OpenAI-compatible endpoint (e.g. a local
    # or self-hosted model server) instead of the real OpenAI API. Leave
    # empty to use OpenAI's default endpoint.
    baseUrl: "https://maas.apps.ocp.home.glroland.com/sandbox/gemma-4/v1"
    existingSecret: "distribution-center-credentials"
    existingSecretKey: OPENAI_API_KEY

  # Ports of the two global services below, mirrored here so the
  # distributionCenter subchart's dc-agent can address them -- Helm only
  # shares `global` values across subcharts, never one subchart's local
  # values with another.
  poIngestApi:
    port: 8000
  supervisorApi:
    port: 8003

  # MLflow tracing (see each service's src/tracing.py), consumed by every
  # service below via the shared ConfigMap in templates/mlflow-configmap.yaml.
  mlflow:
    enabled: true
    trackingUri: ""
    workspace: "distribution-center"
    experimentName: "distribution-center"
    # kubernetes-namespaced auto-reads the pod's own service-account token and
    # namespace (mlflow[kubernetes], bundled in every service's requirements.txt)
    # for Authorization + X-MLFLOW-WORKSPACE -- no token Secret to manage or
    # rotate. Set to "" to disable and fall back to no auth.
    trackingAuth: "kubernetes-namespaced"
    # Optional: dual-export traces to a separate OTLP collector (e.g. Tempo/Jaeger)
    # alongside MLflow. Leave both empty to skip OTLP entirely.
    otlpEndpoint: ""
    otlpHeaders: ""

# ---------------------------------------------------------------------------
# Global (cluster-shared) services. Each is its own subchart under charts/.
# ---------------------------------------------------------------------------

poIngestApi:
  enabled: true
  image:
    repository: po-ingest-api
  replicaCount: 1
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "1"
      memory: 2Gi
  route:
    enabled: true

supervisorApi:
  enabled: true
  image:
    repository: supervisor-api
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  route:
    enabled: false

dashboardUi:
  enabled: true
  image:
    repository: dashboard-ui
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  route:
    enabled: true
  # Hand-mirrors distributionCenter.centers below (name + ports) so this
  # dashboard can address each DC's in-cluster services -- see
  # charts/dashboardUi/values.yaml for why this can't just reference
  # distributionCenter.centers directly.
  distributionCenters:
    - name: distribution-center-a
      displayName: "Distribution Center A"
      dcAgentPort: 9100
      wmsApiPort: 8001
      robotApiPort: 8002
      shippingApiPort: 8004
      grid:
        width: 10
        height: 10
      dock:
        x: 0
        "y": 0

# ---------------------------------------------------------------------------
# Distribution centers (charts/distributionCenter subchart). Each entry in
# centers is a self-contained "local" grouping: one dc-agent, wms-api,
# robot-api, and shipping-api, wired to talk only to each other (plus the
# two global services above). Add more entries here to stand up additional
# distribution centers -- no template changes required.
# ---------------------------------------------------------------------------

distributionCenter:
  centers:
    - name: distribution-center-a
      displayName: "Distribution Center A"
      locationName: DC-VIRTUAL-01

      dcAgent:
        image:
          repository: local-dc-agent
        port: 9100
        maxFulfillmentTurns: 1000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        route:
          enabled: true

      wmsApi:
        image:
          repository: local-wms-api
        port: 8001
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Seeds the ConfigMap mounted at data/inventory.csv. Override per
        # distribution center to give each one its own starting inventory.
        inventoryCsv: |
          sku,on_hand_qty,location_x,location_y
          SKU-1001,120,3,5
          SKU-1002,45,7,2
          SKU-1003,300,1,1
          SKU-1004,0,9,4
          SKU-1005,78,5,8
          SKU-1006,60,2,9
          SKU-1007,15,0,3
          SKU-1008,200,4,6
          SKU-1009,33,8,1
          SKU-1010,90,6,0
          SKU-1011,25,1,7
          SKU-1012,50,9,9
          SKU-1013,110,3,2
          SKU-1014,40,7,5
          SKU-1015,65,2,4
          SKU-1016,150,5,3
          SKU-1017,20,0,8
          SKU-1018,80,6,6

      robotApi:
        image:
          repository: local-inventory-robot-api
        port: 8002
        grid:
          width: 10
          height: 10
        dock:
          x: 0
          "y": 0
        carryCapacity: 100
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Seeds the ConfigMap mounted at data/shelves.csv.
        shelvesCsv: |
          sku,qty,location_x,location_y
          SKU-1001,50,3,5
          SKU-1001,10,6,6
          SKU-1002,20,7,2
          SKU-1003,15,1,8
          SKU-1004,40,9,4
          SKU-1005,5,5,6
          SKU-1006,60,2,9
          SKU-1007,15,0,3
          SKU-1008,45,4,6
          SKU-1009,33,8,1
          SKU-1010,90,6,0
          SKU-1011,25,1,7
          SKU-1012,50,9,9
          SKU-1013,20,3,2
          SKU-1014,40,7,5
          SKU-1015,30,2,4
          SKU-1016,75,5,3
          SKU-1017,20,0,8
          SKU-1018,80,6,6

      shippingApi:
        image:
          repository: local-shipping-api
        port: 8004
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
