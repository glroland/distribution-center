# Template for the OpenAI credentials Secret that dc-agent reads via
# global.openai.existingSecret / global.openai.existingSecretKey
# (deploy/helm/values.yaml). Deliberately NOT rendered by the Helm chart --
# apply it with deploy/apply-openai-secret.sh instead, so the API key never
# has to pass through `helm install/upgrade --set` or live in values.yaml.
#
# ${SECRET_NAME} and ${OPENAI_API_KEY} are filled in by that script; don't
# apply this file directly unless you substitute them yourself first.
apiVersion: v1
kind: Secret
metadata:
  name: ${SECRET_NAME}
  labels:
    app.kubernetes.io/part-of: ai-distribution-center
    app.kubernetes.io/component: openai-credentials
type: Opaque
stringData:
  OPENAI_API_KEY: ${OPENAI_API_KEY}
