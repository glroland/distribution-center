apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-distribution-center
spec:
  destination:
    name: in-cluster
    namespace: ai-distribution-center
    server: https://kubernetes.default.svc
  source:
    path: deploy/helm
    repoURL: https://github.com/glroland/dc-agent.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: global.imageRegistry
          value: registry.home.glroland.com/distribution-center
  sources: []
  project: default

